<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务详情 - 查勘任务管理系统</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .detail-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .detail-card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--primary);
    }
    .detail-card-header svg {
      width: 18px;
      height: 18px;
    }
    .detail-card-body {
      padding: 16px 20px;
    }
    .detail-row {
      display: flex;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
      align-items: flex-start;
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-row .detail-label {
      width: 100px;
      flex-shrink: 0;
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .detail-row .detail-value {
      flex: 1;
      font-size: 0.9rem;
      color: var(--text-primary);
      word-break: break-word;
      line-height: 1.5;
    }
    .detail-row .detail-value a {
      color: var(--primary);
      text-decoration: none;
    }
    .detail-row .detail-value a:hover {
      text-decoration: underline;
    }
    .detail-remark-content {
      font-size: 0.9rem;
      color: var(--text-primary);
      line-height: 1.7;
      padding: 12px 16px;
      background: var(--bg);
      border-radius: var(--radius);
      white-space: pre-wrap;
    }
    .status-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 16px 20px;
    }
    @media (max-width: 768px) {
      .detail-row {
        flex-direction: column;
        gap: 4px;
      }
      .detail-row .detail-label {
        width: auto;
        font-size: 0.8rem;
      }
      .action-buttons {
        flex-direction: column;
      }
      .action-buttons .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="topNav"></div>

  <div class="page-container">
    <!-- 返回 -->
    <div class="page-header">
      <a href="tasks.html" class="btn btn-secondary btn-sm">← 返回列表</a>
    </div>

    <!-- 任务详情 -->
    <div id="taskDetail" class="card">
      <div class="loading-spinner"></div>
    </div>

    <!-- 操作按钮区 -->
    <div id="actionButtons" class="detail-card" style="display:none">
      <div class="detail-card-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
        操作
      </div>
      <div id="actionContent" class="action-buttons"></div>
    </div>

    <!-- 查勘状态更新弹窗 -->
    <div id="surveyModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeSurveyModal()">
      <div class="modal">
        <div class="modal-header">
          <h3>更新查勘状态</h3>
          <button class="modal-close" onclick="closeSurveyModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">查勘状态</label>
            <select id="surveyStatus" class="form-control">
              <option value="not_surveyed">待查勘</option>
              <option value="surveyed">已查勘</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">查勘备注</label>
            <textarea id="surveyRemark" class="form-control" rows="3" placeholder="请输入查勘备注"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeSurveyModal()">取消</button>
          <button class="btn btn-primary" id="submitSurveyBtn" onclick="submitSurvey()">确认</button>
        </div>
      </div>
    </div>

    <!-- 处理状态更新弹窗 -->
    <div id="processModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeProcessModal()">
      <div class="modal">
        <div class="modal-header">
          <h3>更新处理状态</h3>
          <button class="modal-close" onclick="closeProcessModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">处理状态</label>
            <select id="processStatus" class="form-control">
              <option value="pending">待处理</option>
              <option value="resurvey">需复查</option>
              <option value="missing_docs">缺资料</option>
              <option value="submitted">已提交</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">处理备注</label>
            <textarea id="processRemark" class="form-control" rows="3" placeholder="请输入处理备注"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeProcessModal()">取消</button>
          <button class="btn btn-primary" id="submitProcessBtn" onclick="submitProcess()">确认</button>
        </div>
      </div>
    </div>

    <!-- 重新指派弹窗 -->
    <div id="reassignModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeReassignModal()">
      <div class="modal">
        <div class="modal-header">
          <h3>重新指派</h3>
          <button class="modal-close" onclick="closeReassignModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">指派给</label>
            <select id="reassignUser" class="form-control">
              <option value="">请选择查勘员</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeReassignModal()">取消</button>
          <button class="btn btn-primary" onclick="submitReassign()">确认指派</button>
        </div>
      </div>
    </div>

    <!-- 修改任务弹窗 -->
    <div id="editModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeEditModal()">
      <div class="modal" style="max-width:560px">
        <div class="modal-header">
          <h3>修改任务</h3>
          <button class="modal-close" onclick="closeEditModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">所属村庄</label>
            <select id="editVillage" class="form-control">
              <option value="">选择村庄</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">详细地址</label>
            <input type="text" id="editAddress" class="form-control" placeholder="请输入详细地址" maxlength="200">
          </div>
          <div class="form-group">
            <label class="form-label">联系人</label>
            <input type="text" id="editContactPerson" class="form-control" placeholder="请输入联系人" maxlength="50">
          </div>
          <div class="form-group">
            <label class="form-label">联系电话</label>
            <input type="tel" id="editContactPhone" class="form-control" placeholder="请输入联系电话" maxlength="20">
          </div>
          <div class="form-group">
            <label class="form-label">出险情况</label>
            <select id="editInsurance" class="form-control">
              <option value="">请选择出险情况</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">指派查勘员</label>
            <select id="editAssignedTo" class="form-control">
              <option value="">不指派</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">备注</label>
            <textarea id="editRemark" class="form-control" rows="3" placeholder="请输入备注信息" maxlength="500"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
          <button class="btn btn-primary" id="submitEditBtn" onclick="submitEdit()">保存修改</button>
        </div>
      </div>
    </div>
  </div>

  <div id="bottomNav"></div>

  <script src="js/app.js"></script>
  <script>
    const currentUser = App.initPage();
    const role = currentUser.role;
    let taskId = null;
    let taskData = null;
    let editVillages = [];
    let editUsers = [];
    let editInsurances = [];

    // 获取任务ID
    const urlParams = new URLSearchParams(location.search);
    taskId = urlParams.get('id');
    if (!taskId) {
      App.showToast('任务ID不存在', 'error');
      setTimeout(() => location.href = 'tasks.html', 1500);
    }

    // 加载任务详情
    async function loadTask() {
      const container = document.getElementById('taskDetail');
      container.innerHTML = '<div class="loading-spinner" style="margin:40px auto"></div>';

      try {
        const { task, logs } = await App.tasks.get(taskId);
        taskData = task;
        renderTaskDetail(taskData);
        renderActions(taskData);
      } catch (e) {
        container.innerHTML = '<div class="empty-state"><p>加载任务失败</p></div>';
      }
    }

    // 渲染任务详情
    function renderTaskDetail(task) {
      const container = document.getElementById('taskDetail');
      container.innerHTML = `
        <div class="detail-card">
          <div class="detail-card-header" style="justify-content:space-between">
            <div style="display:flex;align-items:center;gap:8px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              任务 #${task.id}
            </div>
            <div class="status-badges">
              ${App.surveyStatusBadge(task.survey_status)}
              ${task.survey_status === 'surveyed' ? App.processStatusBadge(task.process_status) : ''}
              ${App.taskTagBadge(task)}
            </div>
          </div>
          <div class="detail-card-body">
            <div class="detail-row">
              <span class="detail-label">所属村庄</span>
              <span class="detail-value">${escapeHtml(task.village_name || '未指定')}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">详细地址</span>
              <span class="detail-value">${task.address ? `<a href="javascript:openMap('${escapeHtml(task.address)}')" style="color:var(--primary);text-decoration:none">${escapeHtml(task.address)} 📍</a>` : '未填写'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">发布时间</span>
              <span class="detail-value">${App.formatDate(task.publish_time || task.created_at)}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">出险情况</span>
              <span class="detail-value">${escapeHtml(task.insurance_name || '未选择')}</span>
            </div>
          </div>
        </div>

        <div class="detail-card">
          <div class="detail-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            联系信息
          </div>
          <div class="detail-card-body">
            <div class="detail-row">
              <span class="detail-label">联系人</span>
              <span class="detail-value">${escapeHtml(task.contact_person || '未填写')}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">联系电话</span>
              <span class="detail-value">${task.contact_phone ? `<a href="tel:${task.contact_phone}">${escapeHtml(task.contact_phone)}</a>` : '未填写'}</span>
            </div>
          </div>
        </div>

        <div class="detail-card">
          <div class="detail-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            人员信息
          </div>
          <div class="detail-card-body">
            <div class="detail-row">
              <span class="detail-label">创建人</span>
              <span class="detail-value">${App.getUserName(task.created_by)}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">指派查勘员</span>
              <span class="detail-value">${task.assigned_to ? App.getUserName(task.assigned_to) : '未指派'}</span>
            </div>
          </div>
        </div>

        ${task.remark ? `
        <div class="detail-card">
          <div class="detail-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            备注
          </div>
          <div class="detail-card-body">
            <div class="detail-remark-content">${escapeHtml(task.remark)}</div>
          </div>
        </div>` : ''}

        ${task.survey_remark ? `
        <div class="detail-card">
          <div class="detail-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            查勘备注
          </div>
          <div class="detail-card-body">
            <div class="detail-remark-content">${escapeHtml(task.survey_remark)}</div>
          </div>
        </div>` : ''}

        ${task.process_remark ? `
        <div class="detail-card">
          <div class="detail-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
            处理备注
          </div>
          <div class="detail-card-body">
            <div class="detail-remark-content">${escapeHtml(task.process_remark)}</div>
          </div>
        </div>` : ''}
      `;
    }

    // 渲染操作按钮
    function renderActions(task) {
      const container = document.getElementById('actionButtons');
      const content = document.getElementById('actionContent');
      let html = '';

      // 有修改权限或admin：修改任务
      if (App.hasPermission(currentUser, 'can_edit') || currentUser.role === 'admin') {
        html += '<button class="btn btn-outline" onclick="openEditModal()">修改任务</button>';
      }

      // 有处理任务权限：更新查勘状态
      if (App.hasPermission(currentUser, 'can_process')) {
        html += '<button class="btn btn-primary" onclick="openSurveyModal()">更新查勘状态</button>';
      }

      // 只有已查勘状态才显示处理状态按钮
      if (task.survey_status === 'surveyed' && App.hasPermission(currentUser, 'can_edit')) {
        html += '<button class="btn btn-warning" onclick="openProcessModal()">更新处理状态</button>';
      }

      // 管理员：重新指派
      if (currentUser.role === 'admin') {
        html += '<button class="btn btn-secondary" onclick="openReassignModal()">重新指派</button>';
      }

      content.innerHTML = html;

      // 有操作按钮时显示
      if (html) {
        container.style.display = '';
      }
    }

    // 查勘状态弹窗
    function openSurveyModal() {
      document.getElementById('surveyStatus').value = taskData.survey_status || 'not_surveyed';
      document.getElementById('surveyRemark').value = '';
      document.getElementById('surveyModal').style.display = '';
    }
    function closeSurveyModal() {
      document.getElementById('surveyModal').style.display = 'none';
    }

    async function submitSurvey() {
      const status = document.getElementById('surveyStatus').value;
      const remark = document.getElementById('surveyRemark').value.trim();
      const btn = document.getElementById('submitSurveyBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        await App.tasks.updateSurvey(taskId, { survey_status: status, survey_remark: remark });
        App.showToast(status === 'surveyed' ? '已标记为已查勘，处理状态自动设为待处理' : '查勘状态更新成功', 'success');
        closeSurveyModal();
        loadTask();
      } catch (e) {
        App.showToast(e.message || '更新失败', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '确认';
      }
    }

    // 处理状态弹窗
    function openProcessModal() {
      document.getElementById('processStatus').value = taskData.process_status || 'pending';
      document.getElementById('processRemark').value = '';
      document.getElementById('processModal').style.display = '';
    }
    function closeProcessModal() {
      document.getElementById('processModal').style.display = 'none';
    }

    async function submitProcess() {
      const status = document.getElementById('processStatus').value;
      const remark = document.getElementById('processRemark').value.trim();
      const btn = document.getElementById('submitProcessBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        await App.tasks.updateProcess(taskId, { process_status: status, process_remark: remark });
        App.showToast('处理状态更新成功', 'success');
        closeProcessModal();
        loadTask();
      } catch (e) {
        App.showToast(e.message || '更新失败', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '确认';
      }
    }

    // 重新指派弹窗
    async function openReassignModal() {
      document.getElementById('reassignModal').style.display = '';
      const select = document.getElementById('reassignUser');
      if (select.options.length <= 1) {
        try {
          const users = await App.loadUsers();
          select.innerHTML = '<option value="">请选择查勘员</option>';
          users.filter(u => (u.can_process || u.role === 'surveyor') && u.is_active !== 0).forEach(u => {
            const opt = document.createElement('option');
            opt.value = u.id;
            opt.textContent = u.username + (u.display_name ? ` (${u.display_name})` : '');
            if (taskData.assigned_to === u.id) opt.selected = true;
            select.appendChild(opt);
          });
        } catch (e) {
          App.showToast('加载用户列表失败', 'error');
        }
      }
    }
    function closeReassignModal() {
      document.getElementById('reassignModal').style.display = 'none';
    }

    async function submitReassign() {
      const userId = document.getElementById('reassignUser').value;
      if (!userId) { App.showToast('请选择查勘员', 'warning'); return; }

      try {
        await App.tasks.reassign(taskId, { assigned_to: parseInt(userId) });
        App.showToast('指派成功', 'success');
        closeReassignModal();
        loadTask();
      } catch (e) {
        App.showToast(e.message || '指派失败', 'error');
      }
    }

    // 修改任务弹窗
    async function openEditModal() {
      document.getElementById('editModal').style.display = '';

      // 加载下拉选项
      try {
        const [villages, users, insurances] = await Promise.all([
          App.loadVillages(),
          App.loadUsers(),
          App.loadInsurances()
        ]);
        editVillages = villages;
        editUsers = users;
        editInsurances = insurances;

        // 村庄
        const villageSelect = document.getElementById('editVillage');
        villageSelect.innerHTML = '<option value="">选择村庄</option>';
        villages.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.id;
          opt.textContent = v.name;
          if (taskData.village_id === v.id) opt.selected = true;
          villageSelect.appendChild(opt);
        });

        // 查勘员
        const assignedSelect = document.getElementById('editAssignedTo');
        assignedSelect.innerHTML = '<option value="">不指派</option>';
        users.filter(u => (u.can_process || u.role === 'surveyor') && u.is_active !== 0).forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = u.username + (u.display_name ? ` (${u.display_name})` : '');
          if (taskData.assigned_to === u.id) opt.selected = true;
          assignedSelect.appendChild(opt);
        });

        // 出险情况
        const insuranceSelect = document.getElementById('editInsurance');
        insuranceSelect.innerHTML = '<option value="">请选择出险情况</option>';
        insurances.forEach(i => {
          const opt = document.createElement('option');
          opt.value = i.id;
          opt.textContent = i.name;
          if (taskData.insurance_id === i.id) opt.selected = true;
          insuranceSelect.appendChild(opt);
        });

        // 填充当前值
        document.getElementById('editAddress').value = taskData.address || '';
        document.getElementById('editContactPerson').value = taskData.contact_person || '';
        document.getElementById('editContactPhone').value = taskData.contact_phone || '';
        document.getElementById('editRemark').value = taskData.remark || '';
      } catch (e) {
        App.showToast('加载选项失败', 'error');
      }
    }
    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    async function submitEdit() {
      const btn = document.getElementById('submitEditBtn');
      btn.disabled = true;
      btn.textContent = '保存中...';

      try {
        const data = {
          village_id: parseInt(document.getElementById('editVillage').value) || null,
          address: document.getElementById('editAddress').value.trim(),
          contact_person: document.getElementById('editContactPerson').value.trim(),
          contact_phone: document.getElementById('editContactPhone').value.trim(),
          insurance_id: parseInt(document.getElementById('editInsurance').value) || null,
          assigned_to: parseInt(document.getElementById('editAssignedTo').value) || null,
          remark: document.getElementById('editRemark').value.trim()
        };

        await App.tasks.update(taskId, data);
        App.showToast('任务修改成功', 'success');
        closeEditModal();
        loadTask();
      } catch (e) {
        App.showToast(e.message || '修改失败', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '保存修改';
      }
    }

    // 打开地图导航
    function openMap(address) {
      if (!address) return;
      // 尝试使用高德地图Web API（手机端会自动唤起App）
      const gaodeUrl = `https://uri.amap.com/search?keyword=${encodeURIComponent(address)}&src=mypage&coordinate=gaode&callnative=1`;
      // 百度地图Web URL（备用）
      const baiduUrl = `https://api.map.baidu.com/geocoder?address=${encodeURIComponent(address)}&output=html`;
      // 优先尝试高德地图（callnative=1会尝试唤起App）
      window.open(gaodeUrl, '_blank');
    }

    // 加载
    loadTask();
  </script>
</body>
</html>
