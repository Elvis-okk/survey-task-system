<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - 查勘任务管理系统</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .settings-card {
      max-width: 480px;
      margin: 0 auto;
    }
    .password-rules {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .password-strength {
      height: 4px;
      border-radius: 2px;
      background: var(--border-light);
      margin-top: 8px;
      overflow: hidden;
    }
    .password-strength-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s, background 0.3s;
      width: 0;
    }
  </style>
</head>
<body>
  <div id="topNav"></div>

  <div class="page-container">
    <div class="page-header">
      <h2>设置</h2>
      <p class="text-muted">账户与安全设置</p>
    </div>

    <div class="card settings-card">
      <div class="form-section">
        <h3 class="form-section-title">修改密码</h3>
        <form id="passwordForm">
          <div class="form-group">
            <label class="form-label">当前密码 <span class="text-danger">*</span></label>
            <input type="password" id="oldPassword" class="form-control" placeholder="请输入当前密码" required>
          </div>
          <div class="form-group">
            <label class="form-label">新密码 <span class="text-danger">*</span></label>
            <input type="password" id="newPassword" class="form-control" placeholder="请输入新密码（至少6位）" required minlength="6">
            <div class="password-strength">
              <div class="password-strength-bar" id="strengthBar"></div>
            </div>
            <div class="password-rules">密码长度至少6位，建议包含字母和数字</div>
          </div>
          <div class="form-group">
            <label class="form-label">确认新密码 <span class="text-danger">*</span></label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="请再次输入新密码" required>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="history.back()">取消</button>
            <button type="submit" id="submitBtn" class="btn btn-primary">
              <span id="btnText">修改密码</span>
              <div id="btnSpinner" class="btn-spinner hidden"></div>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="bottomNav"></div>

  <script src="js/app.js"></script>
  <script>
    const currentUser = App.initPage();

    // 密码强度检测
    document.getElementById('newPassword').addEventListener('input', function() {
      const val = this.value;
      const bar = document.getElementById('strengthBar');
      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      const percent = Math.min(strength * 20, 100);
      const colors = ['var(--danger)', 'var(--danger)', 'var(--warning)', 'var(--info)', 'var(--success)', 'var(--success)'];
      bar.style.width = percent + '%';
      bar.style.background = colors[strength] || colors[0];
    });

    // 提交修改密码
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 6) {
        App.showToast('新密码长度不能少于6位', 'warning');
        return;
      }

      if (newPassword !== confirmPassword) {
        App.showToast('两次输入的新密码不一致', 'warning');
        return;
      }

      if (oldPassword === newPassword) {
        App.showToast('新密码不能与当前密码相同', 'warning');
        return;
      }

      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      btn.disabled = true;
      btnText.textContent = '修改中...';
      btnSpinner.classList.remove('hidden');

      try {
        await App.auth.changePassword(oldPassword, newPassword);
        App.showToast('密码修改成功，请重新登录', 'success');
        // 清除登录状态，跳转到登录页
        setTimeout(() => {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          location.href = 'index.html';
        }, 1500);
      } catch (err) {
        App.showToast(err.message || '密码修改失败', 'error');
      } finally {
        btn.disabled = false;
        btnText.textContent = '修改密码';
        btnSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
