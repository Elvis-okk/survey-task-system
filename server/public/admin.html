<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统管理 - 查勘任务管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topNav"></div>

  <div class="page-container">
    <div class="page-header">
      <h2>系统管理</h2>
    </div>

    <!-- 标签页 -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('users')">用户管理</button>
      <button class="tab" onclick="switchTab('tags')">标签管理</button>
      <button class="tab" onclick="switchTab('villages')">村社区管理</button>
      <button class="tab" onclick="switchTab('insurances')">出险情况</button>
      <button class="tab" onclick="switchTab('data')">导入导出</button>
    </div>

    <!-- 用户管理 -->
    <div id="tab-users" class="tab-content active">
      <div class="section-header">
        <h3>用户列表</h3>
        <button class="btn btn-primary btn-sm" onclick="openUserModal()">+ 添加用户</button>
      </div>
      <div class="card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>显示名</th>
                <th>角色</th>
                <th>负责村社区</th>
                <th>权限</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <tr><td colspan="7"><div class="loading-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 标签管理 -->
    <div id="tab-tags" class="tab-content">
      <div class="section-header">
        <h3>标签列表</h3>
        <button class="btn btn-primary btn-sm" onclick="openTagModal()">+ 添加标签</button>
      </div>
      <div class="card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>名称</th>
                <th>颜色</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tagTableBody">
              <tr><td colspan="4"><div class="loading-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 村社区管理 -->
    <div id="tab-villages" class="tab-content">
      <div class="section-header">
        <h3>村社区列表</h3>
        <button class="btn btn-primary btn-sm" onclick="openVillageModal()">+ 添加村社区</button>
      </div>
      <div class="card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>名称</th>
                <th>负责人</th>
                <th>联系电话</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="villageTableBody">
              <tr><td colspan="5"><div class="loading-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 出险情况管理 -->
    <div id="tab-insurances" class="tab-content">
      <div class="section-header">
        <h3>出险情况列表</h3>
        <button class="btn btn-primary btn-sm" onclick="openInsuranceModal()">+ 添加出险情况</button>
      </div>
      <div class="card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>名称</th>
                <th>描述</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="insuranceTableBody">
              <tr><td colspan="4"><div class="loading-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 导入导出 -->
    <div id="tab-data" class="tab-content">
      <div class="section-header">
        <h3>数据导入导出</h3>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <!-- 任务数据 -->
        <div class="card" style="padding:20px">
          <h4 style="margin:0 0 16px 0">任务数据</h4>
          <div style="display:flex;flex-direction:column;gap:12px">
            <button class="btn btn-primary" onclick="exportTasks()" id="btnExportTasks">导出所有任务 (xlsx)</button>
            <div>
              <label class="btn btn-secondary" style="display:inline-block;cursor:pointer">
                导入任务 (xlsx)
                <input type="file" accept=".xlsx,.xls" style="display:none" onchange="importTasks(event)">
              </label>
              <span id="importTasksStatus" style="margin-left:8px;font-size:0.85rem;color:var(--text-muted)"></span>
            </div>
          </div>
        </div>
        <!-- 系统配置 -->
        <div class="card" style="padding:20px">
          <h4 style="margin:0 0 16px 0">系统配置及用户设置</h4>
          <div style="display:flex;flex-direction:column;gap:12px">
            <button class="btn btn-primary" onclick="exportConfig()" id="btnExportConfig">导出系统配置 (xlsx)</button>
            <div>
              <label class="btn btn-secondary" style="display:inline-block;cursor:pointer">
                导入系统配置 (xlsx)
                <input type="file" accept=".xlsx,.xls" style="display:none" onchange="importConfig(event)">
              </label>
              <span id="importConfigStatus" style="margin-left:8px;font-size:0.85rem;color:var(--text-muted)"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:20px;padding:16px">
        <p style="margin:0;font-size:0.85rem;color:var(--text-muted)">
          提示：导出文件为xlsx格式，可直接用Excel打开编辑后导入。导入任务时，村社区名称需与系统中的名称一致。导入系统配置时，已有用户将更新信息，新用户默认密码为123456。
        </p>
      </div>
    </div>
  </div>

  <!-- 用户弹窗 -->
  <div id="userModal" class="modal-overlay" style="display:none" onclick="closeUserModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="userModalTitle">添加用户</h3>
        <button class="modal-close" onclick="closeUserModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editUserId">
        <div class="form-group">
          <label class="form-label">用户名 <span class="text-danger">*</span></label>
          <input type="text" id="userUsername" class="form-control" placeholder="请输入用户名" maxlength="50">
        </div>
        <div class="form-group" id="passwordGroup">
          <label class="form-label">密码 <span class="text-danger">*</span></label>
          <input type="password" id="userPassword" class="form-control" placeholder="请输入密码" maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label">显示名</label>
          <input type="text" id="userDisplayName" class="form-control" placeholder="请输入显示名" maxlength="50">
        </div>
        <div class="form-group">
          <label class="form-label">角色</label>
          <select id="userRole" class="form-control">
            <option value="surveyor">查勘员</option>
            <option value="publisher">发布者</option>
            <option value="admin">管理员</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">权限</label>
          <div style="display:flex;flex-direction:column;gap:8px;padding-top:4px">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" id="permPublish"> <span>发布任务</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" id="permEdit"> <span>修改任务</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" id="permProcess"> <span>处理任务</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">负责村社区</label>
          <div id="userVillageCheckboxes" style="display:flex;flex-wrap:wrap;gap:8px;padding-top:4px;max-height:120px;overflow-y:auto;border:1px solid var(--border-light);border-radius:var(--radius);padding:8px">
            <span class="text-muted" style="font-size:0.8rem">加载中...</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeUserModal()">取消</button>
        <button class="btn btn-primary" id="submitUserBtn" onclick="submitUser()">确认</button>
      </div>
    </div>
  </div>

  <!-- 标签弹窗 -->
  <div id="tagModal" class="modal-overlay" style="display:none" onclick="closeTagModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="tagModalTitle">添加标签</h3>
        <button class="modal-close" onclick="closeTagModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editTagId">
        <div class="form-group">
          <label class="form-label">名称 <span class="text-danger">*</span></label>
          <input type="text" id="tagName" class="form-control" placeholder="请输入标签名称" maxlength="30">
        </div>
        <div class="form-group">
          <label class="form-label">颜色</label>
          <input type="color" id="tagColor" class="form-control form-color" value="#4F46E5">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeTagModal()">取消</button>
        <button class="btn btn-primary" onclick="submitTag()">确认</button>
      </div>
    </div>
  </div>

  <!-- 村社区弹窗 -->
  <div id="villageModal" class="modal-overlay" style="display:none" onclick="closeVillageModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="villageModalTitle">添加村社区</h3>
        <button class="modal-close" onclick="closeVillageModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editVillageId">
        <div class="form-group">
          <label class="form-label">名称 <span class="text-danger">*</span></label>
          <input type="text" id="villageName" class="form-control" placeholder="请输入村社区名称" maxlength="50">
        </div>
        <div class="form-group">
          <label class="form-label">负责人</label>
          <select id="villageLeader" class="form-control">
            <option value="">请选择负责人</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">联系电话</label>
          <input type="tel" id="villagePhone" class="form-control" placeholder="请输入联系电话" maxlength="20">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeVillageModal()">取消</button>
        <button class="btn btn-primary" onclick="submitVillage()">确认</button>
      </div>
    </div>
  </div>

  <!-- 出险情况弹窗 -->
  <div id="insuranceModal" class="modal-overlay" style="display:none" onclick="closeInsuranceModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="insuranceModalTitle">添加出险情况</h3>
        <button class="modal-close" onclick="closeInsuranceModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editInsuranceId">
        <div class="form-group">
          <label class="form-label">名称 <span class="text-danger">*</span></label>
          <input type="text" id="insuranceName" class="form-control" placeholder="请输入出险情况名称" maxlength="30">
        </div>
        <div class="form-group">
          <label class="form-label">描述</label>
          <input type="text" id="insuranceDesc" class="form-control" placeholder="请输入描述（可选）" maxlength="100">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeInsuranceModal()">取消</button>
        <button class="btn btn-primary" onclick="submitInsurance()">确认</button>
      </div>
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div id="passwordModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closePasswordModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>修改密码</h3>
        <button class="modal-close" onclick="closePasswordModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="passwordUserId">
        <div class="form-group">
          <label class="form-label">用户</label>
          <input type="text" id="passwordUsername" class="form-control" disabled>
        </div>
        <div class="form-group">
          <label class="form-label">新密码 <span class="text-danger">*</span></label>
          <input type="password" id="newPassword" class="form-control" placeholder="请输入新密码（至少6位）" maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label">确认密码 <span class="text-danger">*</span></label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="请再次输入新密码" maxlength="100">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
        <button class="btn btn-primary" id="submitPasswordBtn" onclick="submitPassword()">确认修改</button>
      </div>
    </div>
  </div>

  <div id="bottomNav"></div>

  <script src="js/app.js"></script>
  <script>
    const currentUser = App.initPage();

    // 权限检查
    if (currentUser.role !== 'admin') {
      App.showToast('您没有管理权限', 'error');
      setTimeout(() => location.href = 'dashboard.html', 1500);
    }

    // 缓存用户列表（用于村社区负责人选择）
    let cachedUsers = [];

    // 标签页切换
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');

      if (tab === 'users') loadUsers();
      else if (tab === 'tags') loadTags();
      else if (tab === 'villages') loadVillages();
      else if (tab === 'insurances') loadInsurances();
      else if (tab === 'data') {} // 导入导出无需额外加载
    }

    // ========== 用户管理 ==========
    async function loadUsers() {
      const tbody = document.getElementById('userTableBody');
      try {
        const users = await App.users.list();
        cachedUsers = users;
        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">暂无用户</td></tr>';
          return;
        }
        tbody.innerHTML = users.map(u => {
          const perms = [];
          if (u.can_publish) perms.push('发布');
          if (u.can_edit) perms.push('修改');
          if (u.can_process) perms.push('处理');
          const permText = perms.length > 0 ? perms.join('、') : '<span class="text-muted">无</span>';
          const villageText = u.village_names || '<span class="text-muted">无</span>';
          return `
          <tr>
            <td>${u.id}</td>
            <td>${escapeHtml(u.username)}</td>
            <td>${escapeHtml(u.display_name || '-')}</td>
            <td><span class="badge ${App.roleBadgeClass(u.role)}">${App.roleName(u.role)}</span></td>
            <td style="font-size:12px">${villageText}</td>
            <td style="font-size:12px">${permText}</td>
            <td><span class="badge ${u.is_active !== 0 ? 'badge-success' : 'badge-danger'}">${u.is_active !== 0 ? '启用' : '禁用'}</span></td>
            <td>
              <button class="btn btn-sm btn-secondary" onclick="editUser(${u.id})">编辑</button>
              <button class="btn btn-sm btn-outline" onclick="openPasswordModal(${u.id}, '${escapeHtml(u.username)}')">改密</button>
              <button class="btn btn-sm ${u.is_active !== 0 ? 'btn-warning' : 'btn-success'}" onclick="toggleUser(${u.id}, ${u.is_active})">${u.is_active !== 0 ? '禁用' : '启用'}</button>
              <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">删除</button>
            </td>
          </tr>`;
        }).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">加载失败</td></tr>';
      }
    }

    function openUserModal(editId) {
      document.getElementById('editUserId').value = '';
      document.getElementById('userUsername').value = '';
      document.getElementById('userPassword').value = '';
      document.getElementById('userDisplayName').value = '';
      document.getElementById('userRole').value = 'surveyor';
      document.getElementById('permPublish').checked = false;
      document.getElementById('permEdit').checked = false;
      document.getElementById('permProcess').checked = false;
      document.getElementById('userModalTitle').textContent = '添加用户';
      document.getElementById('passwordGroup').style.display = '';
      document.getElementById('userUsername').disabled = false;
      // 加载村庄checkbox
      loadVillageCheckboxes([]);
      document.getElementById('userModal').style.display = '';
      // 角色切换时自动设置权限
      updatePermsFromRole();
    }

    // 加载村庄checkbox列表
    async function loadVillageCheckboxes(selectedIds) {
      const container = document.getElementById('userVillageCheckboxes');
      try {
        const villages = await App.loadVillages();
        if (villages.length === 0) {
          container.innerHTML = '<span class="text-muted" style="font-size:0.8rem">暂无村社区，请先在村社区管理中添加</span>';
          return;
        }
        container.innerHTML = villages.map(v => {
          const checked = selectedIds.includes(String(v.id)) ? 'checked' : '';
          return `<label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:0.85rem;white-space:nowrap">
            <input type="checkbox" class="user-village-cb" value="${v.id}" ${checked}> ${escapeHtml(v.name)}
          </label>`;
        }).join('');
      } catch (e) {
        container.innerHTML = '<span class="text-muted" style="font-size:0.8rem">加载失败</span>';
      }
    }

    // 获取选中的村庄ID（逗号分隔字符串）
    function getSelectedVillageIds() {
      const checkboxes = document.querySelectorAll('.user-village-cb:checked');
      return Array.from(checkboxes).map(cb => cb.value).join(',');
    }

    // 角色切换自动设置权限
    function updatePermsFromRole() {
      const role = document.getElementById('userRole').value;
      if (role === 'admin') {
        document.getElementById('permPublish').checked = true;
        document.getElementById('permEdit').checked = true;
        document.getElementById('permProcess').checked = true;
      } else if (role === 'publisher') {
        document.getElementById('permPublish').checked = true;
        document.getElementById('permEdit').checked = true;
        document.getElementById('permProcess').checked = false;
      } else if (role === 'surveyor') {
        document.getElementById('permPublish').checked = false;
        document.getElementById('permEdit').checked = false;
        document.getElementById('permProcess').checked = true;
      }
    }
    document.getElementById('userRole').addEventListener('change', updatePermsFromRole);

    async function editUser(id) {
      try {
        const users = await App.users.list();
        const user = users.find(u => u.id === id);
        if (!user) return;
        document.getElementById('editUserId').value = user.id;
        document.getElementById('userUsername').value = user.username;
        document.getElementById('userUsername').disabled = false;
        document.getElementById('userPassword').value = '';
        document.getElementById('passwordGroup').style.display = 'none';
        document.getElementById('userDisplayName').value = user.display_name || '';
        document.getElementById('userRole').value = user.role;
        document.getElementById('permPublish').checked = !!user.can_publish;
        document.getElementById('permEdit').checked = !!user.can_edit;
        document.getElementById('permProcess').checked = !!user.can_process;
        document.getElementById('userModalTitle').textContent = '编辑用户';
        // 回填村庄checkbox
        const selectedIds = (user.village_ids || '').split(',').filter(id => id.trim() !== '');
        await loadVillageCheckboxes(selectedIds);
        document.getElementById('userModal').style.display = '';
      } catch (e) {
        App.showToast('加载用户信息失败', 'error');
      }
    }

    function closeUserModal() {
      document.getElementById('userModal').style.display = 'none';
    }

    async function submitUser() {
      const editId = document.getElementById('editUserId').value;
      const username = document.getElementById('userUsername').value.trim();
      const password = document.getElementById('userPassword').value;
      const displayName = document.getElementById('userDisplayName').value.trim();
      const role = document.getElementById('userRole').value;
      const canPublish = document.getElementById('permPublish').checked;
      const canEdit = document.getElementById('permEdit').checked;
      const canProcess = document.getElementById('permProcess').checked;
      const villageIds = getSelectedVillageIds();

      if (!username) { App.showToast('请输入用户名', 'warning'); return; }
      if (!editId && !password) { App.showToast('请输入密码', 'warning'); return; }

      const btn = document.getElementById('submitUserBtn');
      btn.disabled = true;

      try {
        if (editId) {
          await App.users.update(editId, {
            username,
            display_name: displayName,
            role,
            village_ids: villageIds,
            can_publish: canPublish,
            can_edit: canEdit,
            can_process: canProcess
          });
          App.showToast('用户更新成功', 'success');
        } else {
          await App.users.create({ username, password, display_name: displayName, role, village_ids: villageIds, can_publish: canPublish, can_edit: canEdit, can_process: canProcess });
          App.showToast('用户创建成功', 'success');
        }
        closeUserModal();
        loadUsers();
        App.clearCache();
      } catch (e) {
        App.showToast(e.message || '操作失败', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function toggleUser(id, currentActive) {
      const action = currentActive !== 0 ? '禁用' : '启用';
      const confirmed = await App.showConfirm(`确定${action}该用户吗？`);
      if (!confirmed) return;

      try {
        await App.users.delete(id);
        App.showToast(`用户已${action}`, 'success');
        loadUsers();
        App.clearCache();
      } catch (e) {
        App.showToast(e.message || '操作失败', 'error');
      }
    }

    async function deleteUser(id) {
      const confirmed = await App.showConfirm('确定永久删除该用户吗？此操作不可恢复！');
      if (!confirmed) return;

      try {
        await App.users.hardDelete(id);
        App.showToast('用户已永久删除', 'success');
        loadUsers();
        App.clearCache();
      } catch (e) {
        App.showToast(e.message || '删除失败', 'error');
      }
    }

    // ========== 修改密码 ==========
    function openPasswordModal(id, username) {
      document.getElementById('passwordUserId').value = id;
      document.getElementById('passwordUsername').value = username;
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
      document.getElementById('passwordModal').style.display = '';
    }

    function closePasswordModal() {
      document.getElementById('passwordModal').style.display = 'none';
    }

    async function submitPassword() {
      const id = document.getElementById('passwordUserId').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!newPassword) { App.showToast('请输入新密码', 'warning'); return; }
      if (newPassword.length < 6) { App.showToast('密码长度不能少于6位', 'warning'); return; }
      if (newPassword !== confirmPassword) { App.showToast('两次输入的密码不一致', 'warning'); return; }

      const btn = document.getElementById('submitPasswordBtn');
      btn.disabled = true;
      btn.textContent = '修改中...';

      try {
        await App.users.updatePassword(id, newPassword);
        App.showToast('密码修改成功', 'success');
        closePasswordModal();
      } catch (e) {
        App.showToast(e.message || '修改失败', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '确认修改';
      }
    }

    async function loadVillageLeaderOptions(selectedLeaderId) {
      const select = document.getElementById('villageLeader');
      // 只加载查勘员列表
      try {
        const surveyors = await App.loadSurveyors();
        select.innerHTML = '<option value="">请选择负责人</option>';
        surveyors.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = u.display_name || u.username;
          if (selectedLeaderId && String(u.id) === String(selectedLeaderId)) opt.selected = true;
          select.appendChild(opt);
        });
      } catch (e) {
        console.error('加载查勘员列表失败:', e);
        select.innerHTML = '<option value="">加载失败</option>';
      }
    }

    // ========== 导入导出 ==========
    async function exportTasks() {
      const btn = document.getElementById('btnExportTasks');
      btn.disabled = true;
      btn.textContent = '导出中...';
      try {
        const token = localStorage.getItem('token');
        const resp = await fetch('/api/export/tasks', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!resp.ok) throw new Error('导出失败');
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `任务导出_${new Date().toISOString().slice(0,10)}.xlsx`;
        a.click();
        URL.revokeObjectURL(url);
        App.showToast('任务导出成功', 'success');
      } catch (e) {
        App.showToast(e.message || '导出失败', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '导出所有任务 (xlsx)';
      }
    }

    async function importTasks(event) {
      const file = event.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('importTasksStatus');
      statusEl.textContent = '导入中...';
      statusEl.style.color = 'var(--text-muted)';
      try {
        const token = localStorage.getItem('token');
        const formData = new FormData();
        formData.append('file', file);
        const resp = await fetch('/api/export/tasks/import', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const data = await resp.json();
        if (data.code === 0) {
          statusEl.textContent = data.message;
          statusEl.style.color = 'var(--success)';
          App.showToast(data.message, 'success');
        } else {
          statusEl.textContent = data.message;
          statusEl.style.color = 'var(--danger)';
          App.showToast(data.message, 'error');
        }
      } catch (e) {
        statusEl.textContent = '导入失败';
        statusEl.style.color = 'var(--danger)';
        App.showToast('导入失败', 'error');
      }
      event.target.value = '';
    }

    async function exportConfig() {
      const btn = document.getElementById('btnExportConfig');
      btn.disabled = true;
      btn.textContent = '导出中...';
      try {
        const token = localStorage.getItem('token');
        const resp = await fetch('/api/export/config', {

        a.href = url;

      }
    }

    async function importConfig(event) {
      const file = event.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('importConfigStatus');
      const confirmed = await App.showConfirm('导入系统配置将更新已有数据并创建新数据，确认继续？');
      if (!confirmed) { event.target.value = ''; return; }
      statusEl.textContent = '导入中...';
      statusEl.style.color = 'var(--text-muted)';
      try {
        const token = localStorage.getItem('token');
        const formData = new FormData();
        formData.append('file', file);
        const resp = await fetch('/api/export/config/import', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const data = await resp.json();
        if (data.code === 0) {
          statusEl.textContent = data.message;
          statusEl.style.color = 'var(--success)';
          App.showToast(data.message, 'success');
          App.clearCache();
          loadUsers();
        } else {
          statusEl.textContent = data.message;
          statusEl.style.color = 'var(--danger)';
          App.showToast(data.message, 'error');
        }
      } catch (e) {
        statusEl.textContent = '导入失败';
        statusEl.style.color = 'var(--danger)';
        App.showToast('导入失败', 'error');
      }
      event.target.value = '';
    }

    // 初始加载
