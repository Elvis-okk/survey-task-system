<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务列表 - 查勘任务管理系统</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tab-bar {
      display: flex;
      gap: 0;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 4px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .tab-item {
      flex: 1;
      text-align: center;
      padding: 10px 8px;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      border: none;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .tab-item:hover {
      color: var(--primary);
      background: var(--primary-bg);
    }
    .tab-item.active {
      background: var(--primary);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    .tab-item .tab-count {
      display: inline-block;
      min-width: 18px;
      height: 18px;
      line-height: 18px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 9px;
      background: rgba(255,255,255,0.3);
      margin-left: 4px;
      padding: 0 5px;
    }
    .tab-item:not(.active) .tab-count {
      background: var(--border-light);
      color: var(--text-muted);
    }
    .filter-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div id="topNav"></div>

  <div class="page-container">
    <div class="page-header">
      <h2>任务列表</h2>
      <div style="display:flex;align-items:center;gap:8px">
        <a href="publish.html" class="btn btn-primary btn-sm" id="publishBtn">+ 发布任务</a>
        <button class="btn btn-sm btn-primary" id="btnMyTasks" onclick="toggleTaskFilter(true)">我的任务</button>
        <button class="btn btn-sm btn-secondary" id="btnAllTasks" onclick="toggleTaskFilter(false)">全部任务</button>
      </div>
    </div>

    <!-- Tab分类 -->
    <div class="tab-bar">
      <button class="tab-item active" data-tab="pending_survey" onclick="switchTab('pending_survey')">
        待查勘<span class="tab-count" id="countPendingSurvey">0</span>
      </button>
      <button class="tab-item" data-tab="processing" onclick="switchTab('processing')">
        处理中<span class="tab-count" id="countProcessing">0</span>
      </button>
      <button class="tab-item" data-tab="completed" onclick="switchTab('completed')">
        已完成<span class="tab-count" id="countCompleted">0</span>
      </button>
    </div>

    <!-- 筛选栏 -->
    <div class="card filter-card">
      <div class="filter-bar">
        <div class="filter-item">
          <select id="filterVillage" class="form-control">
            <option value="">全部村庄</option>
          </select>
        </div>
        <div class="filter-item">
          <select id="filterTag" class="form-control">
            <option value="">全部标签</option>
          </select>
        </div>
        <div class="filter-item" id="processStatusFilter" style="display:none">
          <select id="filterProcessStatus" class="form-control">
            <option value="">全部处理状态</option>
            <option value="pending">待处理</option>
            <option value="resurvey">需复勘</option>
            <option value="missing_docs">缺资料</option>
            <option value="rejected">拒赔</option>
          </select>
        </div>
        <div class="filter-item">
          <button class="btn btn-secondary btn-sm" onclick="resetFilters()">重置</button>
        </div>
      </div>
    </div>

    <!-- 任务列表 -->
    <div id="taskList" class="task-list">
      <div class="loading-spinner"></div>
    </div>

    <!-- 分页 -->
    <div id="pagination" class="pagination"></div>
  </div>

  <div id="bottomNav"></div>

  <script src="js/app.js"></script>
  <script>
    const currentUser = App.initPage();
    const role = currentUser.role;

    // 权限控制 - 发布任务权限
    if (!App.hasPermission(currentUser, 'can_publish')) {
      document.getElementById('publishBtn').style.display = 'none';
    }

    // 任务过滤状态
    let showMyTasks = true;
    let currentTab = 'pending_survey';

    function toggleTaskFilter(myTasks) {
      showMyTasks = myTasks;
      document.getElementById('btnMyTasks').className = `btn btn-sm ${myTasks ? 'btn-primary' : 'btn-secondary'}`;
      document.getElementById('btnAllTasks').className = `btn btn-sm ${myTasks ? 'btn-secondary' : 'btn-primary'}`;
      currentPage = 1;
      loadTasks();
      loadTabCounts();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-item').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === tab);
      });
      // 处理中Tab显示处理状态筛选
      document.getElementById('processStatusFilter').style.display = tab === 'processing' ? '' : 'none';
      currentPage = 1;
      loadTasks();
    }

    // 状态
    let currentPage = 1;
    const pageSize = 10;
    let totalPages = 1;
    let searchTimer = null;

    // 从URL参数初始化
    function initFromUrl() {
      const params = new URLSearchParams(location.search);
      if (params.get('tab')) {
        currentTab = params.get('tab');
        document.querySelectorAll('.tab-item').forEach(el => {
          el.classList.toggle('active', el.dataset.tab === currentTab);
        });
      }
    }

    // 加载筛选选项
    async function loadFilterOptions() {
      try {
        const [tags, villages] = await Promise.all([
          App.loadTags(),
          App.loadVillages()
        ]);

        const tagSelect = document.getElementById('filterTag');
        tags.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.name;
          opt.textContent = t.name;
          tagSelect.appendChild(opt);
        });

        const villageSelect = document.getElementById('filterVillage');
        villages.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.id;
          opt.textContent = v.name;
          villageSelect.appendChild(opt);
        });
      } catch (e) {
        console.error('加载筛选选项失败:', e);
      }
    }

    // 加载Tab计数
    async function loadTabCounts() {
      try {
        const baseParams = {};
        if (showMyTasks) {
          if (role === 'surveyor') {
            baseParams.assigned_to = currentUser.id;
          } else if (role === 'publisher') {
            baseParams.created_by = currentUser.id;
          } else if (role === 'admin') {
            baseParams.assigned_to = currentUser.id;
          }
        }

        // 待查勘数
        const pendingData = await App.tasks.list({ ...baseParams, task_category: 'pending_survey', pageSize: 1 });
        document.getElementById('countPendingSurvey').textContent = pendingData.total || 0;

        // 处理中数
        const processData = await App.tasks.list({ ...baseParams, task_category: 'processing', pageSize: 1 });
        document.getElementById('countProcessing').textContent = processData.total || 0;

        // 已完成数
        const completedData = await App.tasks.list({ ...baseParams, task_category: 'completed', pageSize: 1 });
        document.getElementById('countCompleted').textContent = completedData.total || 0;
      } catch (e) {
        console.error('加载计数失败:', e);
      }
    }

    // 获取筛选参数
    function getFilterParams() {
      const params = {
        page: currentPage,
        pageSize,
        task_category: currentTab
      };

      const villageId = document.getElementById('filterVillage').value;
      if (villageId) params.village_id = parseInt(villageId);

      const tag = document.getElementById('filterTag').value;
      if (tag) params.tag = tag;

      // 处理中Tab的处理状态筛选
      const processStatus = document.getElementById('filterProcessStatus').value;
      if (currentTab === 'processing' && processStatus) {
        params.process_status = processStatus;
      }

      // 任务过滤：我的任务 vs 全部任务
      if (showMyTasks) {
        if (role === 'surveyor') {
          params.assigned_to = currentUser.id;
        } else if (role === 'publisher') {
          params.created_by = currentUser.id;
        } else if (role === 'admin') {
          params.assigned_to = currentUser.id;
        }
      }

      return params;
    }

    // 加载任务列表
    async function loadTasks() {
      const container = document.getElementById('taskList');
      container.innerHTML = '<div class="loading-spinner"></div>';

      try {
        const params = getFilterParams();
        const result = await App.tasks.list(params);
        const tasks = result.tasks || [];
        const total = result.total || 0;
        totalPages = Math.ceil(total / pageSize) || 1;

        if (tasks.length === 0) {
          const emptyMsg = {
            'pending_survey': '暂无待查勘任务',
            'processing': '暂无处理中任务',
            'completed': '暂无已完成任务'
          }[currentTab] || '暂无任务数据';
          container.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
              </svg>
              <p>${emptyMsg}</p>
            </div>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        container.innerHTML = tasks.map(task => {
          const showProcess = task.survey_status === 'surveyed' && task.process_status;
          const canDelete = true;
          return `
          <div class="task-card" onclick="location.href='task-detail.html?id=${task.id}'">
            <div class="task-card-header">
              <span class="task-card-title">${escapeHtml(task.title)}</span>
              ${App.surveyStatusBadge(task.survey_status)}
            </div>
            <div class="task-card-body">
              <div class="task-card-info">
                <span>📍 ${escapeHtml(task.village_name || task.address || '未指定')}</span>
                <span>📅 ${App.formatDateShort(task.publish_time || task.created_at)}</span>
                ${task.insurance_name ? `<span>⚠️ ${escapeHtml(task.insurance_name)}</span>` : ''}
                ${task.assignee_name ? `<span>👤 ${escapeHtml(task.assignee_name)}</span>` : ''}
              </div>
                            ${App.taskTagBadge(task)}
            </div>
            <div class="task-card-footer">
              ${showProcess ? App.processStatusBadge(task.process_status) : ''}
              ${canDelete ? `<button class="btn btn-danger btn-sm task-delete-btn" onclick="event.stopPropagation();deleteTask(${task.id},'${escapeHtml(task.title)}')" title="删除任务">🗑️ 删除</button>` : ''}
            </div>
          </div>
        `}).join('');

        renderPagination(total);
      } catch (e) {
        console.error('加载任务失败:', e);
        container.innerHTML = '<div class="empty-state"><p>加载失败，请刷新重试</p></div>';
      }
    }

    // 渲染分页
    function renderPagination(total) {
      const container = document.getElementById('pagination');
      if (totalPages <= 1) { container.innerHTML = ''; return; }

      let html = '';
      html += `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">上一页</button>`;

      const start = Math.max(1, currentPage - 2);
      const end = Math.min(totalPages, currentPage + 2);

      if (start > 1) {
        html += `<button class="page-btn" onclick="goPage(1)">1</button>`;
        if (start > 2) html += '<span class="page-ellipsis">...</span>';
      }

      for (let i = start; i <= end; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }

      if (end < totalPages) {
        if (end < totalPages - 1) html += '<span class="page-ellipsis">...</span>';
        html += `<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;
      }

      html += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">下一页</button>`;
      container.innerHTML = html;
    }

    function goPage(page) {
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      loadTasks();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetFilters() {
      document.getElementById('filterVillage').value = '';
      document.getElementById('filterTag').value = '';
      document.getElementById('filterProcessStatus').value = '';
      currentPage = 1;
      loadTasks();
    }

    // 删除任务
    async function deleteTask(taskId, taskTitle) {
      const confirmed = await App.showConfirm('删除任务', `确定要删除任务"${taskTitle}"吗？此操作不可撤销。`);
      if (!confirmed) return;
      try {
        await App.tasks.delete(taskId);
        App.showToast('任务删除成功', 'success');
        loadTasks();
        loadTabCounts();
      } catch (e) {
        App.showToast(e.message || '删除失败', 'error');
      }
    }

    // 事件监听
    document.getElementById('filterVillage').addEventListener('change', () => { currentPage = 1; loadTasks(); });
    document.getElementById('filterTag').addEventListener('change', () => { currentPage = 1; loadTasks(); });
    document.getElementById('filterProcessStatus').addEventListener('change', () => { currentPage = 1; loadTasks(); });

    // 初始化
    initFromUrl();
    loadFilterOptions();
    loadTasks();
    loadTabCounts();
  </script>
</body>
</html>
