version: '3.8'

services:
  survey-app:
    image: ghcr.io/elvis-okk/survey-task-system:1.0
    build: .
    container_name: survey-task-system
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DB_PATH=${DB_PATH:-/app/data/survey.db}
      - AUTO_SAVE_INTERVAL=${AUTO_SAVE_INTERVAL:-5}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3000}/api/auth/login"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
