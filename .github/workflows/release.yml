name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_NAME: survey-task-system

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=survey_task
          storeFile=release.keystore
          EOF
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/gradle-7.5.1
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-7.5.1-v3
          restore-keys: gradle-${{ runner.os }}-
      - name: Build APK
        working-directory: android
        run: |
          GRADLE_DIR="$HOME/gradle-7.5.1"
          if [ ! -f "$GRADLE_DIR/bin/gradle" ]; then
            echo "Downloading Gradle 7.5.1..."
            curl -fsSL https://services.gradle.org/distributions/gradle-7.5.1-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d "$HOME"
            rm -f /tmp/gradle.zip
          fi
          echo "Building APK..."
          "$GRADLE_DIR/bin/gradle" assembleRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk

  create-release:
    needs: [build-and-push-docker, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: V${{ github.ref_name }}
          body: |
            版本 ${{ github.ref_name }}

            ## Docker 镜像

            **Docker Hub:**
            ```bash
            docker pull elvisokk/survey-task-system:latest
            ```

            **GitHub Container Registry:**
            ```bash
            docker pull ghcr.io/elvis-okk/survey-task-system:latest
            ```

            ## Android APK
            下载下方附件安装使用
          files: ./artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}