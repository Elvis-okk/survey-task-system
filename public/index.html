<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查勘任务发布处理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- 顶部导航栏 -->
  <nav class="bg-white shadow-sm border-b border-gray-200 fixed top-0 left-0 right-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex justify-between items-center h-14">
        <div class="flex items-center gap-3">
          <div class="logo-icon w-8 h-8 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
          </div>
          <h1 class="text-lg font-bold text-gray-800 hidden sm:block" id="systemName">查勘任务发布处理系统</h1>
          <h1 class="text-lg font-bold text-gray-800 sm:hidden">查勘系统</h1>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-sm text-gray-600" id="currentUser"></span>
          <span class="status-badge text-xs" id="roleBadge"></span>
          <button onclick="App.logout()" class="text-sm text-gray-500 hover:text-red-500 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体布局 -->
  <div class="pt-14 flex">
    <!-- 左侧菜单 (电脑端) -->
    <aside class="sidebar hidden md:flex flex-col w-56 fixed left-0 top-14 bottom-0 bg-white border-r border-gray-200 overflow-y-auto">
      <nav class="flex-1 py-4 px-3 space-y-1" id="sideMenu"></nav>
    </aside>

    <!-- 主内容区域 -->
    <main class="flex-1 md:ml-56 pb-20 md:pb-4 min-h-screen">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4" id="mainContent">
        <!-- 动态内容 -->
      </div>
    </main>
  </div>

  <!-- 底部导航 (手机端) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50" id="bottomNav">
    <div class="flex justify-around items-center h-14" id="bottomMenu"></div>
  </nav>

  <!-- 通知提示 -->
  <div id="toastContainer" class="fixed top-16 right-4 z-50 space-y-2"></div>

  <!-- 确认对话框 -->
  <div id="confirmModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="App.closeConfirm()"></div>
    <div class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full mx-4 relative z-10">
      <h3 class="text-lg font-semibold text-gray-800 mb-2" id="confirmTitle">确认操作</h3>
      <p class="text-gray-600 mb-6" id="confirmMessage"></p>
      <div class="flex gap-3 justify-end">
        <button onclick="App.closeConfirm()" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 transition-colors">取消</button>
        <button onclick="App.confirmAction()" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-xl hover:bg-blue-700 transition-colors" id="confirmBtn">确定</button>
      </div>
    </div>
  </div>

  <!-- 任务详情模态框 -->
  <div id="taskDetailModal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="App.closeTaskDetail()"></div>
    <div class="bg-white rounded-t-2xl md:rounded-2xl shadow-xl w-full md:max-w-2xl max-h-[85vh] overflow-y-auto relative z-10">
      <div class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex justify-between items-center rounded-t-2xl">
        <h3 class="text-lg font-semibold text-gray-800">任务详情</h3>
        <button onclick="App.closeTaskDetail()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="p-6" id="taskDetailContent"></div>
    </div>
  </div>

  <!-- 用户编辑模态框 -->
  <div id="userModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="App.closeUserModal()"></div>
    <div class="bg-white rounded-2xl shadow-xl p-6 max-w-md w-full mx-4 relative z-10">
      <h3 class="text-lg font-semibold text-gray-800 mb-4" id="userModalTitle">添加用户</h3>
      <form id="userForm" class="space-y-4">
        <input type="hidden" id="userId">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
          <input type="text" id="userUsername" class="input-field w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" placeholder="请输入用户名" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
          <input type="password" id="userPassword" class="input-field w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" placeholder="请输入密码（至少6位）">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">显示名称</label>
          <input type="text" id="userDisplayName" class="input-field w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" placeholder="请输入显示名称" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">角色</label>
          <select id="userRole" class="input-field w-full px-3 py-2 border border-gray-200 rounded-xl text-sm">
            <option value="publisher">发布人员</option>
            <option value="surveyor">查勘人员</option>
            <option value="admin">管理员</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">所属村/社区</label>
          <select id="userVillage" class="input-field w-full px-3 py-2 border border-gray-200 rounded-xl text-sm">
            <option value="">无</option>
          </select>
        </div>
        <div class="flex gap-3 justify-end pt-2">
          <button type="button" onclick="App.closeUserModal()" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200">取消</button>
          <button type="submit" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-xl hover:bg-blue-700">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 标签编辑模态框 -->
  <div id="tagModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="App.closeTagModal()"></div>
    <div class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full mx-4 relative z-10">
      <h3 class="text-lg font-semibold text-gray-800 mb-4" id="tagModalTitle">添加标签</h3>
      <form id="tagForm" class="space-y-4">
        <input type="hidden" id="tagId">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">标签名称</label>
          <input type="text" id="tagName" class="input-field w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" placeholder="请输入标签名称" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">颜色</label>
          <input type="color" id="tagColor" value="#3B82F6" class="w-full h-10 rounded-xl border border-gray-200 cursor-pointer">
        </div>
        <div class="flex gap-3 justify-end pt-2">
          <button type="button" onclick="App.closeTagModal()" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200">取消</button>
          <button type="submit" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-xl hover:bg-blue-700">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 村/社区编辑模态框 -->
  <div id="villageModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="App.closeVillageModal()"></div>
    <div class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full mx-4 relative z-10">
      <h3 class="text-lg font-semibold text-gray-800 mb-4" id="villageModalTitle">添加村/社区</h3>
      <form id="villageForm" class="space-y-4">
        <input type="hidden" id="villageId">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">名称</label>
          <input type="text" id="villageName" class="input-field w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" placeholder="请输入村/社区名称" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">负责人</label>
          <select id="villageLeader" class="input-field w-full px-3 py-2 border border-gray-200 rounded-xl text-sm">
            <option value="">无</option>
          </select>
        </div>
        <div class="flex gap-3 justify-end pt-2">
          <button type="button" onclick="App.closeVillageModal()" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200">取消</button>
          <button type="submit" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-xl hover:bg-blue-700">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
