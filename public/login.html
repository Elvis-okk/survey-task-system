<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 查勘任务发布处理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 50%, #3b7ab5 100%);
      min-height: 100vh;
    }
    .login-card {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
    }
    .btn-primary {
      background: linear-gradient(135deg, #2d5a87, #3b7ab5);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1e3a5f, #2d5a87);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(45, 90, 135, 0.4);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .input-field {
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: #3b7ab5;
      box-shadow: 0 0 0 3px rgba(59, 122, 181, 0.15);
    }
    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .logo-icon {
      background: linear-gradient(135deg, #2d5a87, #3b7ab5);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- 登录卡片 -->
    <div class="login-card rounded-2xl shadow-2xl p-8">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="logo-icon w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">查勘任务发布处理系统</h1>
        <p class="text-gray-500 mt-1 text-sm">请登录您的账号</p>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" class="space-y-5">
        <!-- 服务器地址 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">服务器地址</label>
          <input type="text" id="serverUrl" 
            class="input-field w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none bg-gray-50"
            placeholder="例如: http://192.168.1.100:3000">
          <p class="text-xs text-gray-400 mt-1">留空则使用当前页面地址</p>
        </div>

        <!-- 用户名 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
            <input type="text" id="username" required
              class="input-field w-full pl-12 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none"
              placeholder="请输入用户名">
          </div>
        </div>

        <!-- 密码 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input type="password" id="password" required
              class="input-field w-full pl-12 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none"
              placeholder="请输入密码">
          </div>
        </div>

        <!-- 错误提示 -->
        <div id="errorMsg" class="hidden text-red-500 text-sm bg-red-50 p-3 rounded-xl"></div>

        <!-- 登录按钮 -->
        <button type="submit" id="loginBtn"
          class="btn-primary w-full py-3 text-white font-medium rounded-xl flex items-center justify-center gap-2">
          <span id="btnText">登 录</span>
          <div id="btnSpinner" class="spinner hidden"></div>
        </button>
      </form>

      <!-- 底部信息 -->
      <div class="mt-6 text-center text-xs text-gray-400">
        <p>查勘任务发布处理系统 v1.0</p>
      </div>
    </div>
  </div>

  <script>
    // 初始化服务器地址
    const savedServer = localStorage.getItem('serverUrl');
    if (savedServer) {
      document.getElementById('serverUrl').value = savedServer;
    }

    // 获取API基础URL
    function getBaseUrl() {
      const serverUrl = document.getElementById('serverUrl').value.trim();
      if (serverUrl) {
        return serverUrl.replace(/\/$/, '');
      }
      return window.location.origin;
    }

    // 登录表单提交
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const serverUrl = document.getElementById('serverUrl').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const loginBtn = document.getElementById('loginBtn');

      // 清除错误
      errorMsg.classList.add('hidden');
      
      // 显示加载状态
      btnText.textContent = '登录中...';
      btnSpinner.classList.remove('hidden');
      loginBtn.disabled = true;

      try {
        const baseUrl = getBaseUrl();
        const response = await fetch(`${baseUrl}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.code === 0) {
          // 保存token和用户信息
          localStorage.setItem('token', result.data.token);
          localStorage.setItem('user', JSON.stringify(result.data.user));
          if (serverUrl) {
            localStorage.setItem('serverUrl', serverUrl);
          }
          // 跳转到主页
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent = result.message || '登录失败';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = '无法连接到服务器，请检查服务器地址';
        errorMsg.classList.remove('hidden');
      } finally {
        btnText.textContent = '登 录';
        btnSpinner.classList.add('hidden');
        loginBtn.disabled = false;
      }
    });

    // 检查是否已登录
    const token = localStorage.getItem('token');
    if (token) {
      // 验证token是否有效
      fetch(`${getBaseUrl()}/api/auth/me`, {
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(res => res.json()).then(result => {
        if (result.code === 0) {
          window.location.href = 'index.html';
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>
